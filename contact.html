<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Sumida Drapery by Angel</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="logo" href="index.html">Sumida Drapery <small>by Angel</small></a>
    <nav class="site-nav">
      <a href="index.html">Home</a><a href="work.html">Work</a>
      <a href="hospitality.html">Hotels</a><a href="about.html">About</a>
      <a href="contact.html" class="btn btn-primary nav-cta" aria-current="page">Contact</a>
    </nav>
  </div></header>
  <main id="main">
    <header class="page-intro"><div class="wrap">
      <p class="eyebrow">Contact</p>
      <h1>Tell us the room.</h1>
    </div></header>
    <section class="section"><div class="wrap contact-layout">
      <form class="form" action="#" method="post">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
        <div class="field"><label for="job">Type of work</label>
          <select id="job" name="job"><option>Local home</option><option>Hotel or commercial</option><option>Fabric supply only</option></select>
        </div>
        <div class="field"><label for="note">Windows, fabric notes, or a short description</label><textarea id="note" name="note" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
      <aside>
        <p>Agoura Hills, California</p>
        <p><a href="https://maps.app.goo.gl/hLPw5W2P3LVh9kPbA">Google Maps listing</a></p>
        <div class="map-frame"><iframe title="Map" src="https://www.google.com/maps?q=34.1466713,-118.7466487&amp;z=16&amp;output=embed" loading="lazy"></iframe></div>
      </aside>
    </div></section>
  </main>
</body>
</html>
