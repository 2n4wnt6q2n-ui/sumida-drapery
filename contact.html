<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Sumida Drapery by Angel</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="inner-page">
  <header class="site-header"><div class="wrap header-inner">
    <a class="logo" href="index.html"><img src="images/logo.svg" alt="Sumida Drapery by Angel"></a>
    <nav class="site-nav"><a href="index.html">Home</a><a href="contact.html" aria-current="page">Write Angel</a></nav>
  </div></header>
  <main><section class="chapter"><div class="wrap">
    <h1>Write Angel first.</h1>
    <p>Goes to angel@sumidadrapery-byangel.com. Email or phone — one is enough.</p>
    <form class="form" id="inquiry" action="https://formsubmit.co/angel@sumidadrapery-byangel.com" method="post">
      <input type="hidden" name="_subject" value="New inquiry — Sumida Drapery by Angel">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="thank-you.html">
      <div class="field"><label for="full-name">Full name</label><input id="full-name" name="full_name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
      <p class="form-alert" id="reach-note" hidden>Add an email or a phone number.</p>
      <fieldset class="field local-field">
        <legend>Is this for a local business?</legend>
        <div class="choice-row">
          <label class="choice"><input type="radio" name="local_business" value="no" id="local-no" checked> No</label>
          <label class="choice"><input type="radio" name="local_business" value="yes" id="local-yes"> Yes</label>
        </div>
      </fieldset>
      <div class="field biz-block"><label for="business">Name of business</label><input id="business" name="business_name"></div>
      <button class="btn btn-fill" type="submit">Send to Angel</button>
    </form>
  </div></section></main>
  <script>
    document.getElementById("inquiry").addEventListener("submit", function (e) {
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var note = document.getElementById("reach-note");
      var biz = document.getElementById("business");
      biz.required = document.getElementById("local-yes").checked;
      if (!document.getElementById("local-yes").checked) biz.value = "";
      if (!email && !phone) { e.preventDefault(); note.hidden = false; } else note.hidden = true;
    });
  </script>
</body></html>
